name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum
      - name: Check that the tag is the version of the script
        run: |
          script=$(sed -n 's/^WTREE_VERSION=//p' bin/wtree)
          test "${GITHUB_REF_NAME#v}" = "$script" || {
            echo "the tag is $GITHUB_REF_NAME and bin/wtree says $script"
            exit 1
          }
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/wtree
            dist/init.lua
            dist/install.sh
